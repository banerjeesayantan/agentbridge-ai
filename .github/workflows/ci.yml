name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-policy-tests:
    name: Backend policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend policy tests
        run: pnpm test

      - name: Typecheck Convex backend
        run: pnpm exec tsc --noEmit -p packages/backend/convex/tsconfig.json

      - name: Typecheck widget
        run: pnpm --filter widget typecheck

            - name: Validate widget build configuration
        run: |
          node -e "const value = process.env.NEXT_PUBLIC_CONVEX_URL; if (!value) throw new Error('NEXT_PUBLIC_CONVEX_URL is missing'); const url = new URL(value); if (url.protocol !== 'https:') throw new Error('NEXT_PUBLIC_CONVEX_URL must use HTTPS');"
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}

      - name: Build all workspace packages
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
