
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-policy-tests:
    name: Backend policy tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informational until the existing Dependabot backlog is triaged.
      # Keep the report in the job log so high/critical advisories are actionable.
      - name: Audit dependency advisories
        continue-on-error: true
        run: |
          pnpm audit --json > "$RUNNER_TEMP/pnpm-audit.json" || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + "/pnpm-audit.json",
            "utf8",
          ));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("Dependency audit counts:", JSON.stringify(counts));
          const vulnerabilities = report.vulnerabilities ?? report.advisories ?? {};
          for (const [name, item] of Object.entries(vulnerabilities)) {
            const via = Array.isArray(item.via)
              ? item.via.map((entry) => typeof entry === "string"
                  ? entry
                  : { title: entry.title, url: entry.url, range: entry.range, severity: entry.severity })
              : item.via;
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via,
            }));
          }
          NODE

      - name: Run backend policy tests
        run: pnpm test

      - name: Run backend Vitest suites
        run: pnpm --dir packages/backend exec vitest run convex

      - name: Typecheck Convex backend
        run: pnpm exec tsc --noEmit -p packages/backend/convex/tsconfig.json

      - name: Typecheck widget
        run: pnpm --filter widget typecheck

      - name: Validate build configuration
        run: |
          node -e "for (const key of ['NEXT_PUBLIC_CONVEX_URL', 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY']) { const value = process.env[key]; if (!value) throw new Error(key + ' is missing'); } const url = new URL(process.env.NEXT_PUBLIC_CONVEX_URL); if (url.protocol !== 'https:') throw new Error('NEXT_PUBLIC_CONVEX_URL must use HTTPS');"
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Build all workspace packages
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
